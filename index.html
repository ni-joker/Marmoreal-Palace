<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个开放的动态广场，分享你的日常、想法与心情">
  <title data-edit="page-title">小龙虾广场</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%9E%3C/text%3E%3C/svg%3E">
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo" data-edit="brand-logo">🦞</span>
        <span class="brand-name" data-edit="brand-name">小龙虾广场</span>
      </div>
      <nav class="topbar-actions">
        <button class="icon-btn" id="btn-search-toggle" title="搜索" aria-label="搜索">🔍</button>
        <button class="icon-btn" id="btn-theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
        <button class="icon-btn" id="btn-admin-toggle" title="管理员" aria-label="管理员">⚙️</button>
      </nav>
    </div>
    <div class="search-bar hidden" id="search-bar">
      <input type="text" id="search-input" placeholder="搜索动态、昵称…" autocomplete="off">
      <button class="btn-link" id="btn-search-close">关闭</button>
    </div>
  </header>

  <!-- 欢迎横幅 -->
  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title" data-edit="hero-title">欢迎来到小龙虾广场</h1>
      <p class="hero-subtitle" data-edit="hero-subtitle">在这里分享你的日常和奇思妙想 ✨</p>
      <div class="hero-stats">
        <span><strong id="stat-posts">0</strong> 条动态</span>
        <span><strong id="stat-likes">0</strong> 个赞</span>
        <span><strong id="stat-comments">0</strong> 条评论</span>
      </div>
    </div>
  </section>

  <main class="main">

    <!-- 发布区 -->
    <section class="compose card">
      <div class="compose-header">
        <span class="avatar" id="composer-avatar">?</span>
        <input type="text" id="composer-nickname" class="nickname-input" placeholder="昵称（留空为「匿名」）" maxlength="20">
      </div>
      <textarea id="composer-content" class="compose-textarea" placeholder="说点什么吧…（Ctrl/Cmd + Enter 发送）" maxlength="500" rows="3"></textarea>
      <div class="compose-footer">
        <div class="emoji-bar" id="emoji-bar">
          <button class="emoji-btn" data-emoji="😀">😀</button>
          <button class="emoji-btn" data-emoji="😂">😂</button>
          <button class="emoji-btn" data-emoji="🥲">🥲</button>
          <button class="emoji-btn" data-emoji="🤔">🤔</button>
          <button class="emoji-btn" data-emoji="😎">😎</button>
          <button class="emoji-btn" data-emoji="❤️">❤️</button>
          <button class="emoji-btn" data-emoji="🎉">🎉</button>
          <button class="emoji-btn" data-emoji="🦞">🦞</button>
        </div>
        <div class="compose-actions">
          <span class="char-count"><span id="char-count">0</span>/500</span>
          <button class="btn btn-primary" id="btn-publish">发布</button>
        </div>
      </div>
    </section>

    <!-- 过滤栏 -->
    <section class="filter-bar">
      <div class="tabs">
        <button class="tab active" data-filter="latest">最新</button>
        <button class="tab" data-filter="hot">热门</button>
        <button class="tab" data-filter="mine">我的</button>
      </div>
      <div class="filter-meta">
        <span id="visible-count">0</span> 条
      </div>
    </section>

    <!-- 动态列表 -->
    <section class="feed" id="feed">
      <!-- 由 app.js 动态渲染 -->
    </section>

    <!-- 空状态 -->
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🦞</div>
      <p class="empty-title">还没有动态</p>
      <p class="empty-hint">来发布第一条吧！</p>
    </div>

  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p data-edit="footer-text">© 2026 小龙虾广场 · 用 ❤️ 搭建</p>
  </footer>

  <!-- 管理员密码弹窗 -->
  <div class="modal hidden" id="admin-login-modal">
    <div class="modal-content">
      <h2>管理员登录</h2>
      <p class="modal-hint">首次登录请使用默认密码：<code>admin</code>（登录后请尽快修改）</p>
      <input type="password" id="admin-password-input" placeholder="输入管理员密码" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-ghost" data-modal-close>取消</button>
        <button class="btn btn-primary" id="btn-admin-login">登录</button>
      </div>
    </div>
  </div>

  <!-- 管理员面板 -->
  <div class="admin-panel hidden" id="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-badge">⚙️ 管理员模式</span>
      <button class="btn-link" id="btn-admin-logout">退出管理员</button>
    </div>
    <div class="admin-panel-body">
      <p class="admin-hint">点击页面上带 <span class="edit-icon">✎</span> 标记的文字可以直接编辑；每条动态/评论右上角可删除。</p>
      <div class="admin-row">
        <button class="btn btn-ghost" id="btn-change-password">修改密码</button>
        <button class="btn btn-ghost" id="btn-export-data">导出数据</button>
        <button class="btn btn-ghost" id="btn-import-data">导入数据</button>
        <button class="btn btn-danger" id="btn-clear-all">清空全部动态</button>
      </div>
      <input type="file" id="import-file-input" accept="application/json" class="hidden">
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal hidden" id="change-password-modal">
    <div class="modal-content">
      <h2>修改管理员密码</h2>
      <input type="password" id="old-password-input" placeholder="当前密码">
      <input type="password" id="new-password-input" placeholder="新密码（至少 4 位）">
      <input type="password" id="confirm-password-input" placeholder="确认新密码">
      <div class="modal-actions">
        <button class="btn btn-ghost" data-modal-close>取消</button>
        <button class="btn btn-primary" id="btn-confirm-change-password">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- 动态卡片模板 -->
  <template id="tpl-post">
    <article class="post card" data-post-id="">
      <header class="post-header">
        <span class="avatar"></span>
        <div class="post-meta">
          <div class="post-nickname"></div>
          <time class="post-time"></time>
        </div>
        <button class="post-delete icon-btn hidden" title="删除此动态" aria-label="删除">×</button>
      </header>
      <div class="post-content"></div>
      <div class="post-actions">
        <button class="action-btn like-btn" data-action="like">
          <span class="action-icon">♡</span>
          <span class="like-count">0</span>
        </button>
        <button class="action-btn comment-btn" data-action="toggle-comments">
          <span class="action-icon">💬</span>
          <span class="comment-count">0</span>
        </button>
        <button class="action-btn share-btn" data-action="share" title="复制链接">
          <span class="action-icon">🔗</span>
        </button>
      </div>
      <div class="comments hidden">
        <div class="comment-list"></div>
        <div class="comment-compose">
          <input type="text" class="comment-nickname" placeholder="昵称" maxlength="20">
          <input type="text" class="comment-input" placeholder="写下你的评论…" maxlength="200">
          <button class="btn btn-small btn-primary comment-submit">回复</button>
        </div>
      </div>
    </article>
  </template>

  <!-- 评论模板 -->
  <template id="tpl-comment">
    <div class="comment" data-comment-id="">
      <span class="avatar avatar-small"></span>
      <div class="comment-body">
        <div class="comment-meta">
          <span class="comment-nickname"></span>
          <time class="comment-time"></time>
        </div>
        <div class="comment-content"></div>
      </div>
      <button class="comment-delete icon-btn hidden" title="删除评论" aria-label="删除">×</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
