<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>员工信息登记表</title>
  <style>
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 640px; margin: 32px auto; padding: 24px; color: #333; }
    h1 { font-size: 22px; margin-bottom: 24px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    .options label { display: inline-flex; align-items: center; margin-right: 14px; font-weight: normal; }
    .options input { width: auto; margin-right: 4px; }
  </style>
</head>
<body>
  <h1>员工信息登记表</h1>
  <form>
    <div class="row">
      <div class="field">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" placeholder="请输入姓名">
      </div>
      <div class="field">
        <label for="age">年龄</label>
        <input type="number" id="age" name="age" placeholder="请输入年龄">
      </div>
    </div>

    <div class="field">
      <label for="email">邮箱</label>
      <input type="email" id="email" name="email" placeholder="example@company.com">
    </div>

    <div class="field">
      <label for="phone">电话</label>
      <input type="tel" id="phone" name="phone" placeholder="请输入电话号码">
    </div>

    <div class="row">
      <div class="field">
        <label for="department">部门</label>
        <select id="department" name="department">
          <option value="">-- 请选择 --</option>
          <option value="engineering">研发部</option>
          <option value="product">产品部</option>
          <option value="design">设计部</option>
          <option value="marketing">市场部</option>
          <option value="hr">人力资源部</option>
        </select>
      </div>
      <div class="field">
        <label for="hireDate">入职日期</label>
        <input type="date" id="hireDate" name="hireDate">
      </div>
    </div>

    <div class="field">
      <label>性别</label>
      <div class="options">
        <label><input type="radio" name="gender" value="male"> 男</label>
        <label><input type="radio" name="gender" value="female"> 女</label>
        <label><input type="radio" name="gender" value="other"> 其他</label>
      </div>
    </div>

    <div class="field">
      <label for="address">家庭住址</label>
      <textarea id="address" name="address" placeholder="请输入完整地址"></textarea>
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="subscribed" name="subscribed"> 订阅公司新闻邮件
      </label>
    </div>

    <button type="submit">提交</button>
  </form>
</body>
</html>
